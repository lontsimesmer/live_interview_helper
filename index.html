<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reasonStr = String((event && event.reason && (event.reason.message || event.reason)) || '');
            if (
              reasonStr.indexOf('WebSocket closed without opened') !== -1 ||
              reasonStr.indexOf('failed to connect to websocket') !== -1
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
        var origError = console.error;
        console.error = function () {
          var firstArg = arguments.length > 0 ? String(arguments[0] || '') : '';
          if (
            firstArg.indexOf('[vite] failed to connect to websocket') !== -1 ||
            firstArg.indexOf('WebSocket closed without opened') !== -1
          ) {
            return;
          }
          return origError.apply(console, arguments);
        };
      })();
    </script>
